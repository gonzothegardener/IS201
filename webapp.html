  <style>
    body {
      font-family: Arial, sans-serif;

      padding: 50px;

    /* Cootie Catcher Styling */
    .catcher {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 250px;
      background-color: #967860;
      border: 2px solid #4a3c30;
      position: relative;
      cursor: pointer;
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .catcher div {
      position: absolute;
      width: 50%;
      height: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #967860;
      border: 2px solid #4a3c30;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s;
    }

    .catcher div:hover {
      background-color: #e9d9c8;
    }

    .catcher .top-left {
      top: 0;
      left: 0;
      transform-origin: bottom right;
    }

    .catcher .top-right {
      top: 0;
      right: 0;
      transform-origin: bottom left;
    }

    .catcher .bottom-left {
      bottom: 0;
      left: 0;
      transform-origin: top right;
    }

    .catcher .bottom-right {
      bottom: 0;
      right: 0;
      transform-origin: top left;
    }

    .fortune {
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
      color: black;
    }

    /* Navbar Styling for visibility */
    .navbar {
      background-color: #333;
      z-index: 10;
    }

    .navbar-nav .nav-item .nav-link {
      color: #fff !important;
      padding: 10px 20px;
      font-size: 16px;
    }

    .navbar-nav .nav-item .nav-link:hover {
      background-color: #555;
    }
  </style>
</head>

  <h1 class="marginbottom">Fortune Teller</h1>
  <div class="catcher">
    <div class="top-left" onclick="revealFortune('You will be followed by a pigeon for exactly 47 minutes. It knows your secrets.')">1</div>
    <div class="top-right" onclick="revealFortune('I see a mysterious package arriving… you didn’t order it, but you’ll keep it anyway.')">2</div>
    <div class="bottom-left" onclick="revealFortune('A book will fall off a shelf in a bookstore. You will pretend it was a sign and buy it. You will never read it.')">3</div>
    <div class="bottom-right" onclick="revealFortune('A turtle will cross your path. You’ll feel like it means something. It doesn’t. But it’s cute.')">4</div>
  </div>

  <div class="fortune" id="fortune"></div>

  <script>
    function revealFortune(fortune) {
      const fortuneElement = document.getElementById('fortune');
      fortuneElement.textContent = fortune;
    }
