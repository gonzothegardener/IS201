  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .catcher {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 250px;
      background-color: #f7b7d8;
      border: 2px solid #c17a9f;
      position: relative;
      cursor: pointer;
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .catcher div {
      position: absolute;
      width: 50%;
      height: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7b7d8;
      border: 2px solid #c17a9f;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s;
    }
    .catcher div:hover {
      background-color: #ffb3d9;
    }
    .catcher .top-left {
      top: 0;
      left: 0;
      transform-origin: bottom right;
    }
    .catcher .top-right {
      top: 0;
      right: 0;
      transform-origin: bottom left;
    }
    .catcher .bottom-left {
      bottom: 0;
      left: 0;
      transform-origin: top right;
    }
    .catcher .bottom-right {
      bottom: 0;
      right: 0;
      transform-origin: top left;
    }
    .fortune {
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
      color: #ff4d94;
    }
  </style>
</head>

  <h1>Fortune Teller (Cootie Catcher)</h1>
  <div class="catcher">
    <div class="top-left" onclick="revealFortune('You will have a great day!')">1</div>
    <div class="top-right" onclick="revealFortune('You will find something unexpected.')">2</div>
    <div class="bottom-left" onclick="revealFortune('A surprise is coming your way soon.')">3</div>
    <div class="bottom-right" onclick="revealFortune('Good luck is on your side!')">4</div>
  </div>

  <div class="fortune" id="fortune"></div>

  <script>
    function revealFortune(fortune) {
      const fortuneElement = document.getElementById('fortune');
      fortuneElement.textContent = fortune;
    }
  </script>
